name: Telegram inbox
on:
  schedule:
    - cron: '*/10 * * * *'   # каждые 10 минут (GitHub может задерживать запуск на несколько минут)
  workflow_dispatch:
concurrency:
  group: update-data
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-telegram.mjs --pages 1
      - run: node scripts/enrich-posts.mjs
      # Новые точки сразу попадают на сайт с пометкой «не проверено».
      - run: node scripts/promote.mjs --all
      - run: npm run check
      # Коммитим сразу в main, без pull request. Если изменений нет, ничего не публикуется.
      - name: Commit inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox.json data/inbox-state.json data/spots.json data/meta.json data/photos
          git diff --cached --quiet && echo "Новых кандидатов нет" && exit 0
          git commit -m "Новые точки из Telegram"
          git pull --rebase origin main
          git push
          # Пуш от имени github-actions не запускает другие workflow, поэтому публикуем сайт явно.
          gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}
